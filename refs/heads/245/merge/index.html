  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
    </head>
    <body>
      <script>
        (async () => {
          let path = window.location.pathname.split('/').slice(2).filter((x) => x !== '').join('/');
          let response = await fetch('https://api.github.com/repos/techno-solutionist-collective/dreadlocks-coverage/contents/' + path);
          let data = await response.json();

          if (!Array.isArray(data)) {
            if (data.type !== 'symlink') {
              console.debug({data});
              throw new Error('Expected symlink');
            }

            // NOTE: Resolve symlink.
            const target = data.target.split('/');
            let count = 0;
            for (const part of target) {
              if (part !== '..') break;
              ++count;
            }

            path = path.split('/').slice(0, -1 - count).concat(target.slice(count)).join('/');
            response = await fetch('https://api.github.com/repos/techno-solutionist-collective/dreadlocks-coverage/contents/' + path);
            data = await response.json();
          }

          if (!Array.isArray(data)) {
            console.debug({data});
            throw new Error('Expected array');
          }

          const exclude = new Set(['.nojekyll', 'index.html']);
          const entries = data
            .filter(({name}) => !exclude.has(name))
            .sort(({name: nameA}, {name: nameB}) => nameA < nameB ? -1 : nameA > nameB ? 1 : 0);

          const ul = document.createElement('ul');
          for (const entry of entries) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.setAttribute('href', encodeURI(entry.name));
            a.textContent = entry.name;
            li.appendChild(a);
            ul.appendChild(li);
          }

          document.body.appendChild(ul);
        })()
      </script>
    <body>
  </html>
